name: Find redesign leads

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 7am in Abuja
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these cities, comma-separated (blank = all in config.json)'
        required: false
        default: ''

jobs:
  find-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SHEET: ${{ secrets.LEADS_SHEET_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Remembers which companies earlier runs already found, so new ones are marked.
      - uses: actions/cache@v4
        with:
          path: leads-output/history.json
          key: leads-history-${{ github.run_id }}
          restore-keys: leads-history-

      - name: Find and score leads
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          LEADS_SHEET_URL: ${{ secrets.LEADS_SHEET_URL }}
          LEADS_SHEET_SECRET: ${{ secrets.LEADS_SHEET_SECRET }}
          ONLY: ${{ inputs.only }}
          LEADS_SUMMARY: ${{ github.event.repository.private && 'on' || 'off' }}
        run: node scripts/leads/find-leads.mjs --out leads-output ${ONLY:+--only "$ONLY"}

      # Only when no Google Sheet is set up: on a public repo anyone can download this file.
      - if: env.HAS_SHEET != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leads
          path: |
            leads-output/leads.csv
            leads-output/all-checked.csv
            leads-output/leads.json
          retention-days: 30
